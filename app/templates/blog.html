{% extends "base.html" %}
{% block content %}
<section class="hero hero--page">
  <div>
    <p class="hero-kicker">Blog archive</p>
    <h1>Long-form posts and ideas.</h1>
    <p class="hero-sub">Markdown sourced directly from OSS, rendered in-place with Obsidian embeds.</p>
  </div>
  <div class="hero-actions">
    <button class="pill-btn ghost" data-refresh-list>Refresh list</button>
  </div>
</section>

<section class="content-split">
  <aside class="panel panel--list">
    <div class="panel-head">
      <h2>Posts</h2>
      <input class="input" type="search" placeholder="Search title" id="blog-search" />
    </div>
    <div class="list-stack" id="blog-list">
      <div class="card placeholder">Loading blog posts...</div>
    </div>
  </aside>

  {% set window_prefix = 'blog' %}
  {% include "blog_window.html" %}
</section>
{% endblock %}
