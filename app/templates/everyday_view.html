{% extends "base.html" %}
{% block content %}
<section class="hero hero--page">
  <div>
    <p class="hero-kicker">Everyday viewer</p>
    <h1>Daily reels, calendar first.</h1>
    <p class="hero-sub">Pick a date to see the reel, text, and attachments.</p>
  </div>
  <div class="hero-actions">
    <button class="pill-btn" data-calendar-today>Today</button>
  </div>
</section>

<section class="everyday-view">
  <aside class="panel calendar-panel">
    <div class="calendar-header">
      <button class="pill-btn ghost" data-calendar-prev>Prev</button>
      <div class="calendar-title" id="calendar-label">Month</div>
      <button class="pill-btn ghost" data-calendar-next>Next</button>
    </div>
    <div class="calendar-week">
      <span>Sun</span>
      <span>Mon</span>
      <span>Tue</span>
      <span>Wed</span>
      <span>Thu</span>
      <span>Fri</span>
      <span>Sat</span>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </aside>

  <article class="panel panel--viewer">
    <div class="viewer-head">
      <h2 id="viewer-date">Select a day</h2>
      <div class="viewer-meta" id="viewer-meta"></div>
    </div>
    <div class="reel-window-shell" id="viewer-reel-window"></div>
  </article>
</section>
{% endblock %}
