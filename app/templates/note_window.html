{% set prefix = window_prefix or 'note' %}
<article class="panel panel--viewer">
  <div class="viewer-head">
    <h2 id="{{ prefix }}-title">Select a note</h2>
    <div class="viewer-meta" id="{{ prefix }}-meta"></div>
  </div>
  <div class="markdown-body" id="{{ prefix }}-content">
    <p class="muted">Pick a note on the left to read.</p>
  </div>
  <div class="attachment-strip" id="{{ prefix }}-attachments"></div>
</article>
