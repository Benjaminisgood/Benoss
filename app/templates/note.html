{% extends "base.html" %}
{% block content %}
<section class="hero hero--page">
  <div>
    <p class="hero-kicker">Note stack</p>
    <h1>Short thoughts, captured fast.</h1>
    <p class="hero-sub">Lightweight markdown pages from OSS, rendered with Obsidian syntax.</p>
  </div>
  <div class="hero-actions">
    <button class="pill-btn ghost" data-refresh-list>Refresh list</button>
  </div>
</section>

<section class="content-split">
  <aside class="panel panel--list">
    <div class="panel-head">
      <h2>Notes</h2>
      <input class="input" type="search" placeholder="Search title" id="note-search" />
    </div>
    <div class="list-stack" id="note-list">
      <div class="card placeholder">Loading notes...</div>
    </div>
  </aside>

  {% set window_prefix = 'note' %}
  {% include "note_window.html" %}
</section>
{% endblock %}
