[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benoss"
version = "0.1.0"
description = "Benoss Flask backend for OSS content"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=2.3.0",
  "Flask-SQLAlchemy>=3.1.0",
  "gunicorn>=21.2.0",
  "oss2>=2.18.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools]
include-package-data = true
